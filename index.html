<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- theme-color는 ThemeContext가 테마에 맞춰 갱신(라이트 #fff7f5 / 다크 #0b1120) -->
  <meta name="theme-color" content="#fff7f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 'default': 상태바가 페이지 위에 겹치지 않고 theme-color를 따름.
       (black-translucent는 흰 글자 고정이라 라이트 헤더 위에서 시계·배터리가 안 보였음) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="스텝바이스텝" />

  <title>스텝바이스텝 💃 라인댄스</title>
  <meta name="description" content="라인댄스 회원을 위한 수업 일정, 안무 영상, 공지사항 앱" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="스텝바이스텝 💃 라인댄스" />
  <meta property="og:description" content="라인댄스 회원을 위한 수업 일정, 안무 영상, 공지사항을 확인하세요!" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />

  <script>
    // 🚑 시동 실패 관찰 장치 (ES5 — 아주 옛 기기에서도 실행됨)
    // 앱이 안 뜨는 기기에서 "검은 화면"만 보이면 원인을 알 수 없으므로,
    // (1) 스크립트 오류가 나거나 (2) 12초가 지나도 초기 로더가 남아 있으면
    // 오류 내용 + 기기 정보를 화면에 띄운다. 앱이 정상 시동되면 아무것도 안 보임.
    (function () {
      var shown = false;
      var box = null;
      function stillBooting() {
        try { return !!document.querySelector('.initial-loader'); } catch (e) { return false; }
      }
      function remove() {
        try { if (box && box.parentNode) box.parentNode.removeChild(box); } catch (e) { }
        box = null;
      }
      function show(title, msg) {
        if (shown || !stillBooting()) return;
        shown = true;
        try {
          box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff;color:#c0392b;border:2px solid #c0392b;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;font-family:-apple-system,sans-serif;word-break:break-all;';
          box.innerHTML = '<b>' + title + '</b><br>' + msg + '<br><span style="color:#888;font-size:11px">' + navigator.userAgent + '</span>'
            + '<div style="text-align:right;margin-top:6px"><button type="button" style="border:1px solid #c0392b;background:#fff;color:#c0392b;border-radius:6px;padding:4px 12px;font-size:12px">닫기</button></div>';
          box.querySelector('button').onclick = remove;
          document.body.appendChild(box);
          // 느린 회선에서 늦게라도 앱이 켜지면(초기 로더 소멸) 상자를 스스로 치운다 — 오탐 잔존 방지
          var t = setInterval(function () {
            if (!stillBooting()) { remove(); clearInterval(t); }
          }, 500);
        } catch (e) { }
      }
      var FAIL = '앱 시동 실패 — 이 화면을 캡처해 보내주세요';
      window.addEventListener('error', function (e) {
        var f = (e.filename || '').split('/').pop();
        show(FAIL, '오류: ' + (e.message || '알 수 없음') + (f ? ' [' + f + ':' + e.lineno + ']' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show(FAIL, '비동기 오류: ' + ((r && (r.message || r.toString())) || '알 수 없음'));
      });
      // 12초 경과는 '실패 확정'이 아니라 '느린 회선'일 수 있으므로 문구를 완화
      setTimeout(function () {
        show('앱을 불러오는 데 시간이 오래 걸립니다', '인터넷이 느리면 조금 더 기다려주세요. 1분이 지나도 이 화면이면 캡처해 보내주세요.');
      }, 12000);
    })();
  </script>
</head>

<body>
  <noscript>앱을 사용하려면 기기의 자바스크립트를 활성화해주세요.</noscript>

  <div id="root" style="background-color: #0a0a0f; min-height: 100vh;">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
      <style>
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-top-color: #ff3366;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        }

        @keyframes spin {
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="initial-loader"></div>
      <div style="color: #888; font-size: 15px; font-family: sans-serif;">앱을 준비하는 중입니다 💃</div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
