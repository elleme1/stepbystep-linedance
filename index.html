<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="스텝바이스텝" />

  <title>스텝바이스텝 💃 라인댄스</title>
  <meta name="description" content="라인댄스 회원을 위한 수업 일정, 안무 영상, 공지사항 앱" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="스텝바이스텝 💃 라인댄스" />
  <meta property="og:description" content="라인댄스 회원을 위한 수업 일정, 안무 영상, 공지사항을 확인하세요!" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />

  <script>
    // 🚑 시동 실패 관찰 장치 (ES5 — 아주 옛 기기에서도 실행됨)
    // 앱이 안 뜨는 기기에서 "검은 화면"만 보이면 원인을 알 수 없으므로,
    // (1) 스크립트 오류가 나거나 (2) 12초가 지나도 초기 로더가 남아 있으면
    // 오류 내용 + 기기 정보를 화면에 띄운다. 앱이 정상 시동되면 아무것도 안 보임.
    (function () {
      var shown = false;
      function stillBooting() {
        try { return !!document.querySelector('.initial-loader'); } catch (e) { return false; }
      }
      function show(msg) {
        if (shown || !stillBooting()) return;
        shown = true;
        try {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff;color:#c0392b;border:2px solid #c0392b;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;font-family:-apple-system,sans-serif;word-break:break-all;';
          d.innerHTML = '<b>앱 시동 실패 — 이 화면을 캡처해 보내주세요</b><br>' + msg + '<br><span style="color:#888;font-size:11px">' + navigator.userAgent + '</span>';
          document.body.appendChild(d);
        } catch (e) { }
      }
      window.addEventListener('error', function (e) {
        var f = (e.filename || '').split('/').pop();
        show('오류: ' + (e.message || '알 수 없음') + (f ? ' [' + f + ':' + e.lineno + ']' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show('비동기 오류: ' + ((r && (r.message || r.toString())) || '알 수 없음'));
      });
      setTimeout(function () { show('12초가 지나도 앱이 켜지지 않았습니다 (스크립트 로드 실패 추정)'); }, 12000);
    })();
  </script>
</head>

<body>
  <noscript>앱을 사용하려면 기기의 자바스크립트를 활성화해주세요.</noscript>

  <div id="root" style="background-color: #0a0a0f; min-height: 100vh;">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
      <style>
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-top-color: #ff3366;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        }

        @keyframes spin {
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="initial-loader"></div>
      <div style="color: #888; font-size: 15px; font-family: sans-serif;">앱을 준비하는 중입니다 💃</div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
